<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Canlı Socket.io & Gerçek Zamanlı Görev Takipçisi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      margin-bottom: 16px;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .events-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .event-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 12px;
      padding: 16px;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .event-type {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .event-type.created { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .event-type.status_changed { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .event-type.updated { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
    .event-type.deleted { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .event-type.attachment { background: rgba(192, 132, 252, 0.2); color: #c084fc; }

    .event-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .event-body {
      font-size: 14px;
      line-height: 1.5;
    }

    .event-user {
      font-weight: 600;
      color: #e0e7ff;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ Real-Time Görev & Proje Akışı</h1>
      <p>Socket.io canlı oda dinleyicisi ve anlık event görselleştirici</p>
    </header>

    <div class="grid">
      <!-- Bağlantı ve Oda Ayarları -->
      <div class="card">
        <div class="card-title">📡 Bağlantı Ayarları</div>
        
        <div id="connectionStatus" class="status-badge">
          <div class="status-dot"></div>
          <span id="statusText">Bağlantı Bekleniyor...</span>
        </div>

        <div class="form-group">
          <label>JWT Bearer Token</label>
          <textarea id="tokenInput" rows="3" placeholder="Giriş yapınca gelen JWT token'ı buraya yapıştırın..."></textarea>
        </div>

        <div class="form-group">
          <label>Proje ID (Project ID)</label>
          <input type="text" id="projectIdInput" placeholder="Örn: 6a88216f8ca7427fcd3dd9d9" />
        </div>

        <button id="connectBtn" class="btn" onclick="connectAndJoin()">
          🚀 Proje Panosuna Bağlan
        </button>
      </div>

      <!-- Canlı Olay Akışı -->
      <div class="card">
        <div class="card-title" style="justify-content: space-between;">
          <span>🔔 Canlı Bildirim Akışı (<span id="eventCount">0</span>)</span>
          <button onclick="clearEvents()" style="background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: underline;">Temizle</button>
        </div>

        <div id="eventsContainer" class="events-container">
          <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <p>Henüz bir olay gerçekleşmedi.<br>Panoya bağlanın ve Swagger üzerinden görev ekleyin veya durumunu değiştirin.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let socket = null;
    let events = [];

    function connectAndJoin() {
      const token = document.getElementById('tokenInput').value.trim();
      const projectId = document.getElementById('projectIdInput').value.trim();

      if (!projectId) {
        alert('Lütfen bağlanmak istediğiniz Proje ID değerini giriniz.');
        return;
      }

      if (socket) {
        socket.disconnect();
      }

      // Socket.io bağlantısı
      socket = io('http://localhost:5001', {
        auth: { token: token },
      });

      const statusBadge = document.getElementById('connectionStatus');
      const statusText = document.getElementById('statusText');

      socket.on('connect', () => {
        statusBadge.classList.add('connected');
        statusText.textContent = `🟢 Sunucuya Bağlandı (${socket.id})`;

        // Proje odasına katıl
        socket.emit('join:project', projectId);
      });

      socket.on('joined:project', (data) => {
        statusText.textContent = `🟢 Canlı Takip Aktif (Proje: ${data.projectId.slice(-6)})`;
      });

      socket.on('disconnect', () => {
        statusBadge.classList.remove('connected');
        statusText.textContent = '🔴 Bağlantı Kesildi';
      });

      // Event dinleyicileri
      socket.on('task:created', (data) => addEventCard('Yeni Görev', 'created', data.task.title, data.createdBy ? data.createdBy.name : 'Bilinmeyen Kullanıcı', `Öncelik: ${data.task.priority.toUpperCase()}`));
      socket.on('task:status_changed', (data) => addEventCard('Durum Değişti', 'status_changed', `${data.taskTitle}`, data.updatedBy ? data.updatedBy.name : 'Kullanıcı', `${data.oldStatus.toUpperCase()} ➔ ${data.newStatus.toUpperCase()}`));
      socket.on('task:updated', (data) => addEventCard('Görev Güncellendi', 'updated', data.task.title, data.updatedBy ? data.updatedBy.name : 'Kullanıcı', 'Görev detayları güncellendi.'));
      socket.on('task:deleted', (data) => addEventCard('Görev Silindi', 'deleted', `Görev ID: ${data.taskId}`, data.deletedBy ? data.deletedBy.name : 'Kullanıcı', 'Görev panodan kaldırıldı.'));
      socket.on('attachment:added', (data) => addEventCard('Dosya Eklendi', 'attachment', data.attachment.originalName, data.uploadedBy ? data.uploadedBy.name : 'Kullanıcı', `Boyut: ${(data.attachment.size / 1024).toFixed(1)} KB`));
      socket.on('member:added', (data) => addEventCard('Yeni Üye', 'created', data.member.user.name, data.addedBy ? data.addedBy.name : 'Yönetici', `Rol: ${data.member.role}`));
    }

    function addEventCard(title, type, primaryText, userName, extra) {
      document.getElementById('emptyState').style.display = 'none';
      const container = document.getElementById('eventsContainer');
      const time = new Date().toLocaleTimeString('tr-TR');

      const card = document.createElement('div');
      card.className = 'event-card';
      card.innerHTML = `
        <div class="event-header">
          <span class="event-type ${type}">${title}</span>
          <span class="event-time">${time}</span>
        </div>
        <div class="event-body">
          <strong style="color: #fff; font-size: 15px;">${primaryText}</strong>
          <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
            <span class="event-user">👤 ${userName}</span> • <span>${extra}</span>
          </div>
        </div>
      `;

      container.prepend(card);
      events.push(card);
      document.getElementById('eventCount').textContent = events.length;
    }

    function clearEvents() {
      const container = document.getElementById('eventsContainer');
      container.innerHTML = `
        <div class="empty-state" id="emptyState">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <p>Henüz bir olay gerçekleşmedi.</p>
        </div>
      `;
      events = [];
      document.getElementById('eventCount').textContent = '0';
    }
  </script>
</body>
</html>
